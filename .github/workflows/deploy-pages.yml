name: Deploy ETF dashboard

on:
  push:
    branches: [main]
  schedule:
    # Exchange fund-share data is often published later in the evening.
    - cron: "35 21 * * 1-5"
      timezone: "Asia/Shanghai"
    # Catch up on the previous trading day if the evening source was late.
    - cron: "10 8 * * 2-6"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: python -m pip install requests

      - name: Refresh market data
        continue-on-error: true
        run: |
          python scripts/fetch_etf_data.py
          python scripts/fetch_commodity_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-boards.json data/commodity-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh market data [skip ci]"
            git push
          fi

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html app.js styles.css _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
